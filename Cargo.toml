[package]
name = "lyslyn"
version = "1.0.0"
edition = "2021"
authors = ["Lyslyn Authors <team@lyslyn.org>"]
description = "Lyslyn: An independent, simple-English systems programming language"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.2", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
colored = "2.1"
regex = "1.10"

[[bin]]
name = "lyslyn"
path = "src/main.rs"

[lib]
name = "lyslyn"
path = "src/lib.rs"
